<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Punto 4</title>
<style>body{font-family:sans-serif;margin:24px}table{border-collapse:collapse;margin:8px 0}td,th{border:1px solid #999;padding:4px 8px}th{background:#eee}</style>
</head>
<body>
    <h1>Punto 4: Function&lt;Plato, Integer&gt; que suma el Stack conteo</h1>
    <table>
        <tr><th>Plato</th><th>Conteo</th><th>Suma (apply)</th></tr>
        <tr th:each="entrada : ${sumas}">
            <td th:text="${entrada.key.nombre}"></td>
            <td th:text="${entrada.key.conteo}"></td>
            <td th:text="${entrada.value}"></td>
        </tr>
    </table>
</body>
</html>
